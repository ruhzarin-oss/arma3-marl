<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>HARMATTAN — Entraînement</title>
<style>
  :root{--bg:#0c1116;--panel:#121a22;--line:#1f2c38;--ink:#cfe3f2;--mut:#7d93a6;--green:#22c55e;--red:#ff5a5a;--blue:#5aa0ff;--obj:#ff7a3c}
  *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:13px}
  #bar{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:26px;align-items:baseline}
  #bar b{font-size:15px;letter-spacing:.1em} .kpi{color:var(--mut)} .kpi b{font-size:20px;letter-spacing:.02em;margin-left:6px}
  #grid{display:flex;height:calc(100vh - 46px)}
  .col{padding:12px 16px} #lc{flex:1.25;border-right:1px solid var(--line);display:flex;flex-direction:column}
  #rc{flex:1;display:flex;flex-direction:column}
  h3{margin:2px 0 8px;font-size:11px;letter-spacing:.18em;color:var(--mut);text-transform:uppercase;font-weight:500}
  canvas{display:block;width:100%;flex:1;background:#0e151c;border:1px solid var(--line);border-radius:4px}
  .lg{margin-top:8px;color:var(--mut);display:flex;gap:18px} .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
</style></head><body>
<div id="bar"><b>HARMATTAN — ENTRAÎNEMENT</b><span class="kpi">iter<b id="it">—</b></span><span class="kpi">neutralisé<b id="neu" style="color:var(--green)">—</b></span><span class="kpi">pertes<b id="per" style="color:var(--red)">—</b></span><span class="kpi">vitesse<b id="trs">—</b></span><span id="ttl" style="color:var(--mut);margin-left:auto"></span></div>
<div id="grid">
  <div class="col" id="lc"><h3>Courbe d'apprentissage</h3><canvas id="curve"></canvas>
    <div class="lg"><span><span class="sw" style="background:var(--green)"></span>neutralisé %</span><span><span class="sw" style="background:var(--red)"></span>pertes %</span><span class="kpi">la politique apprend à prendre l'objectif en limitant les pertes</span></div></div>
  <div class="col" id="rc"><h3>Replay d'épisode — comportement appris</h3><canvas id="rep"></canvas>
    <div class="lg"><span><span class="sw" style="background:var(--blue)"></span>agents</span><span><span class="sw" style="background:var(--red)"></span>défenseurs</span><span><span class="sw" style="background:var(--obj)"></span>objectif</span><span class="kpi" id="repit">—</span></div></div>
</div>
<script>
function dpr(){return window.devicePixelRatio||1}
const cc=document.getElementById('curve'),cx=cc.getContext('2d');
const rc=document.getElementById('rep'),rx=rc.getContext('2d');
function fit(c){c.width=c.clientWidth*dpr();c.height=c.clientHeight*dpr();}
addEventListener('resize',()=>{fit(cc);fit(rc);});setTimeout(()=>{fit(cc);fit(rc);},50);
// ---- courbe ----
function curve(h,iters){fit(cc);const W=cc.width,H=cc.height,P=34*dpr();cx.clearRect(0,0,W,H);
  cx.strokeStyle="#16212c";cx.lineWidth=1;cx.fillStyle="#56707f";cx.font=(10*dpr())+"px monospace";
  for(let p=0;p<=100;p+=25){const y=H-P-(H-2*P)*p/100;cx.beginPath();cx.moveTo(P,y);cx.lineTo(W-6,y);cx.stroke();cx.fillText(p+"%",4,y+3);}
  const maxit=Math.max(iters-1,(h.length-1)||1);
  const xx=i=>P+(W-P-6)*i/maxit, yy=v=>H-P-(H-2*P)*v/100;
  function plot(key,col){cx.strokeStyle=col;cx.lineWidth=2*dpr();cx.beginPath();h.forEach((d,i)=>{const x=xx(d.it),y=yy(d[key]);i?cx.lineTo(x,y):cx.moveTo(x,y);});cx.stroke();}
  if(h.length){plot("per","#ff5a5a");plot("neu","#22c55e");
    const last=h[h.length-1];cx.fillStyle="#22c55e";cx.beginPath();cx.arc(xx(last.it),yy(last.neu),3.5*dpr(),0,7);cx.fill();}
  cx.fillStyle="#56707f";cx.fillText("itération →",W-78*dpr(),H-8);}
// ---- replay ----
let rep=null, fi=0;
function drawRep(){if(!rep){return;}fit(rc);const W=rc.width,H=rc.height,R=rep.R,G=rep.G;
  const sz=Math.min(W,H), ox=(W-sz)/2, oy=(H-sz)/2;
  const X=wx=>ox+(wx+R)/(2*R)*sz, Y=wy=>oy+sz-(wy+R)/(2*R)*sz;
  // terrain
  const cell=sz/G;for(let gy=0;gy<G;gy++)for(let gx=0;gx<G;gx++){const v=rep.terr[gy][gx];const c=40+Math.round(v*0.9);
    rx.fillStyle=`rgb(${Math.round(c*0.55)},${Math.round(c*0.7)},${Math.round(c*0.55)})`;rx.fillRect(ox+gx*cell,oy+sz-(gy+1)*cell,cell+1,cell+1);}
  // objectif au centre
  rx.strokeStyle="#ff7a3c";rx.lineWidth=2*dpr();const s=9*dpr();rx.strokeRect(X(0)-s,Y(0)-s,2*s,2*s);
  const f=rep.frames[Math.min(fi,rep.frames.length-1)];if(!f)return;
  for(const d of f.df){const x=X(d[0]),y=Y(d[1]),r=5*dpr();if(d[2]){rx.fillStyle="#ff5a5a";rx.beginPath();rx.arc(x,y,r,0,7);rx.fill();}else{rx.strokeStyle="#7a4a4a";rx.lineWidth=2*dpr();rx.beginPath();rx.moveTo(x-r,y-r);rx.lineTo(x+r,y+r);rx.moveTo(x+r,y-r);rx.lineTo(x-r,y+r);rx.stroke();}}
  for(const a of f.ag){const x=X(a[0]),y=Y(a[1]),r=5.5*dpr();if(a[2]){rx.fillStyle="#5aa0ff";rx.beginPath();rx.arc(x,y,r,0,7);rx.fill();}else{rx.strokeStyle="#3f5a6e";rx.lineWidth=2*dpr();rx.beginPath();rx.moveTo(x-r,y-r);rx.lineTo(x+r,y+r);rx.moveTo(x+r,y-r);rx.lineTo(x-r,y+r);rx.stroke();}}
}
setInterval(()=>{if(rep&&rep.frames.length){fi=(fi+1)%(rep.frames.length+6);drawRep();}},140);
async function tick(){
  try{const m=await(await fetch('train_metrics.json?_='+Date.now())).json();const h=m.hist||[];
    if(h.length){const l=h[h.length-1];document.getElementById('it').textContent=l.it+" / "+(m.iters-1);
      document.getElementById('neu').textContent=l.neu+"%";document.getElementById('per').textContent=l.per+"%";document.getElementById('trs').textContent=(l.trs/1000).toFixed(0)+"k tr/s";}
    document.getElementById('ttl').textContent=m.title||"";curve(h,m.iters||220);}catch(e){document.getElementById('ttl').textContent="en attente d'un entraînement…";}
  try{const r=await(await fetch('train_replay.json?_='+Date.now())).json();if(!rep||rep.iter!==r.iter){rep=r;fi=0;}document.getElementById('repit').textContent="épisode à l'itération "+r.iter;drawRep();}catch(e){}
}
setInterval(tick,1500);tick();
</script></body></html>
