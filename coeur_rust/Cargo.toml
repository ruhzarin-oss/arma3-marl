[package]
name = "coeur_monde"
version = "0.1.0"
edition = "2021"
description = "Le coeur du monde en Rust : les routines de masse, paralleles sur tous les coeurs"

[lib]
name = "coeur"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
numpy = "0.25"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
